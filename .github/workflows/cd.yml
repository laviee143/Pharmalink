name: Continuous Deployment

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    environment:
      name: staging
      url: https://staging.pharmalink.com
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18.x'
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json

    - name: Install dependencies
      run: |
        cd backend
        npm ci

    - name: Run tests
      run: |
        cd backend
        npm test
      env:
        NODE_ENV: test
        DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        REDIS_URL: ${{ secrets.STAGING_REDIS_URL }}
        JWT_SECRET: ${{ secrets.STAGING_JWT_SECRET }}
        JWT_REFRESH_SECRET: ${{ secrets.STAGING_JWT_REFRESH_SECRET }}

    - name: Build application
      run: |
        cd backend
        npm run build

    - name: Build Docker image
      run: |
        cd backend
        docker build -t pharmalink-backend:staging .
        docker tag pharmalink-backend:staging ${{ secrets.DOCKER_REGISTRY }}/pharmalink-backend:staging

    - name: Login to Docker registry
      run: echo ${{ secrets.DOCKER_PASSWORD }} | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin

    - name: Push Docker image
      run: |
        docker push ${{ secrets.DOCKER_REGISTRY }}/pharmalink-backend:staging

    - name: Deploy to staging
      run: |
        echo "Deploying to staging environment..."
        # Add your deployment commands here
        # For example, using kubectl, helm, or your deployment tool

    - name: Run health check
      run: |
        sleep 30
        curl -f https://staging.pharmalink.com/health || exit 1

    - name: Run smoke tests
      run: |
        cd backend
        npm run test:smoke
      env:
        API_URL: https://staging.pharmalink.com

  deploy-production:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    environment:
      name: production
      url: https://api.pharmalink.com
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18.x'
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json

    - name: Install dependencies
      run: |
        cd backend
        npm ci

    - name: Run tests
      run: |
        cd backend
        npm test
      env:
        NODE_ENV: test
        DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        REDIS_URL: ${{ secrets.PRODUCTION_REDIS_URL }}
        JWT_SECRET: ${{ secrets.PRODUCTION_JWT_SECRET }}
        JWT_REFRESH_SECRET: ${{ secrets.PRODUCTION_JWT_REFRESH_SECRET }}

    - name: Build application
      run: |
        cd backend
        npm run build

    - name: Build Docker image
      run: |
        cd backend
        docker build -t pharmalink-backend:latest .
        docker tag pharmalink-backend:latest ${{ secrets.DOCKER_REGISTRY }}/pharmalink-backend:${{ github.ref_name }}
        docker tag pharmalink-backend:latest ${{ secrets.DOCKER_REGISTRY }}/pharmalink-backend:latest

    - name: Login to Docker registry
      run: echo ${{ secrets.DOCKER_PASSWORD }} | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin

    - name: Push Docker images
      run: |
        docker push ${{ secrets.DOCKER_REGISTRY }}/pharmalink-backend:${{ github.ref_name }}
        docker push ${{ secrets.DOCKER_REGISTRY }}/pharmalink-backend:latest

    - name: Deploy to production
      run: |
        echo "Deploying to production environment..."
        # Add your deployment commands here
        # For example, using kubectl, helm, or your deployment tool

    - name: Run health check
      run: |
        sleep 60
        curl -f https://api.pharmalink.com/health || exit 1

    - name: Run smoke tests
      run: |
        cd backend
        npm run test:smoke
      env:
        API_URL: https://api.pharmalink.com

    - name: Run performance tests
      run: |
        cd backend
        npm run test:performance
      env:
        API_URL: https://api.pharmalink.com

    - name: Notify deployment
      uses: 8398a7/action-slack@v3
      with:
        status: ${{ job.status }}
        text: "Production deployment ${{ job.status }}: ${{ github.ref_name }}"
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  rollback:
    runs-on: ubuntu-latest
    if: failure() && startsWith(github.ref, 'refs/tags/v')
    needs: deploy-production
    
    steps:
    - name: Rollback production
      run: |
        echo "Rolling back production deployment..."
        # Add your rollback commands here

    - name: Notify rollback
      uses: 8398a7/action-slack@v3
      with:
        status: failure
        text: "Production rollback triggered for ${{ github.ref_name }}"
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
